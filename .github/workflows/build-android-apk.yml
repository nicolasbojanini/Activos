name: Build Android APK

on:
  workflow_dispatch:
  push:
    # feat/android-6-compat: rama de compatibilidad con Android 6.0 (ver apps/mobile/ANDROID6.md).
    # Sus builds se publican como PRE-release (ver el último paso), nunca como release normal.
    branches: [main, feat/android-6-compat]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'packages/ui-tokens/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # mobile está fuera del workspace de pnpm y tiene su propio lockfile.
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      # mobile se instala solo (node-linker=hoisted, React 18.2, Expo SDK 51): ver
      # pnpm-workspace.yaml y apps/mobile/ANDROID6.md. Ya no depende de instalar api/web.
      - name: Instalar dependencias de mobile
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile --ignore-workspace

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Identificador corto de este build, horneado en la app (ver
      # actualizacion.ts) para poder comparar "qué versión tengo instalada"
      # contra la última publicada como GitHub Release. github.run_number
      # (EXPO_PUBLIC_BUILD_NUMBER, abajo) es el número humano-legible que se
      # muestra en la pantalla de inicio (ver InicioScreen.tsx) — sube 1 por
      # cada build, a diferencia del hash de commit, que no sirve para que un
      # coordinador le pregunte a un auditor "qué número ves" por teléfono.
      - name: Calcular id de build
        id: build_id
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Expo prebuild (genera el proyecto nativo android/)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api-production-1d41b.up.railway.app/api/v1
          EXPO_PUBLIC_BUILD_ID: ${{ steps.build_id.outputs.sha_short }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: npx expo prebuild --platform android --non-interactive

      - name: Compilar APK release (JS empaquetado adentro, sin depender de Metro)
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://api-production-1d41b.up.railway.app/api/v1
          EXPO_PUBLIC_BUILD_ID: ${{ steps.build_id.outputs.sha_short }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        # La variante "debug" carga el JS desde un Metro corriendo en la
        # máquina del desarrollador (localhost:8081) — inútil para un APK que
        # alguien más va a instalar. La plantilla de Android de Expo firma
        # "release" con el mismo keystore de debug por defecto, así que esto
        # no necesita ningún keystore ni secreto adicional.
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APK como artefacto descargable (debug/histórico)
        uses: actions/upload-artifact@v4
        with:
          name: adn-auditoria-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Fuente de verdad para la actualización manual: a diferencia del
      # artefacto de arriba (requiere sesión de GitHub para bajarlo), el
      # asset de un Release es un link público directo — lo que la app
      # ofrece abrir cuando detecta que hay una versión más nueva, y lo que
      # se le puede compartir a un auditor por WhatsApp sin pedirle que
      # tenga acceso al repo.
      - name: Publicar GitHub Release con el APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.build_id.outputs.sha_short }}
          name: APK ${{ steps.build_id.outputs.sha_short }}
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      # Builds de ramas de prueba: PRE-release, a propósito. GitHub excluye los
      # pre-releases de /releases/latest, que es lo único que consulta la app
      # (actualizacion.ts) para avisarle al auditor "hay una versión nueva" — así un
      # APK sin validar nunca le llega a nadie por ese aviso. Igual queda con link
      # público directo para instalarlo a mano en las PDAs de prueba.
      - name: Publicar PRE-release del APK (rama de pruebas)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-prueba-${{ github.run_number }}-${{ steps.build_id.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          name: APK de prueba #${{ github.run_number }} (${{ github.ref_name }}, ${{ steps.build_id.outputs.sha_short }})
          prerelease: true
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
